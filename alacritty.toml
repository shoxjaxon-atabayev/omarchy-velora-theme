# Velora keeps the terminal background fully opaque on purpose. Under Quattro,
# window translucency has a single source: decoration:active_opacity /
# inactive_opacity in this theme's hyprland.lua (0.92 / 0.88), with Hyprland's
# blur behind it. Stacking a translucent terminal background on top of that
# produced the washed-out "transparent terminal" look, not frosted glass.
#
# Window padding, decorations and font size are owned by Omarchy's own
# ~/.config/alacritty/alacritty.toml, which imports this file and then
# overrides them -- setting them here has no effect under Omarchy 4.
[window]
opacity = 1.0

[colors.primary]
background = "#1a1b1e"
foreground = "#eaeaef"

[colors.cursor]
text = "#2b2d31"
cursor = "#f2a0a0"

[colors.normal]
black   = "#2b2d31"
red     = "#ef5d67"
green   = "#8edb73"
yellow  = "#f7c553"
blue    = "#7ca5ff"
magenta = "#e29ef3"
cyan    = "#7dd8d3"
white   = "#f8f8fa"

[colors.bright]
black   = "#505258"
red     = "#ff7680"
green   = "#a2ee8b"
yellow  = "#ffd86f"
blue    = "#97b6ff"
magenta = "#efb5f9"
cyan    = "#94e8e3"
white   = "#ffffff"

[colors.selection]
text = "#2b2d31"
background = "#b2c3ff"

[colors.vi_mode_cursor]
text   = "#2b2d31"
cursor = "#bfc6ff"
