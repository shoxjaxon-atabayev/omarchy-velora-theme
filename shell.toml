# Omarchy Velora — Quickshell surfaces (Omarchy 4 / Quattro).
#
# A literal rendering of default/themed/shell.toml.tpl against this theme's
# colors.toml, with explicit overrides where Velora differs from the template.
# Sections with no Velora design intent (controls, spacing, font, image-picker)
# are left at the template's own default values.
#
# NOTE: a hand-written shell.toml is copied verbatim by
# omarchy-theme-set-templates (no {{ }} substitution runs on non-.tpl files),
# so every value below is a literal, not a placeholder. This also freezes
# controls/spacing/font/image-picker at today's template defaults -- shipping
# shell.<section>.toml overrides instead would let those sections keep tracking
# future Quattro template updates. Flagging the trade-off; keeping the single
# hand-written file as requested.
#
# ── The material scale ─────────────────────────────────────────────────────
# Every surface below is blurred by Hyprland (see hyprland.lua's layer rules
# and its blur.contrast/brightness/vibrancy, which is what actually makes the
# blurred backdrop read as glass instead of a flat tint). These alphas are
# the tint weight, not a transparency budget -- three deliberate tiers, not
# one flat value everywhere:
#
#   thin     0.43  content cards      menu, launcher, clipboard, emojis
#   regular  0.52  persistent chrome  bar, popups (flyouts/panels/OSD/etc)
#   regular  0.55  must-read surface  polkit prompt (legibility over frost)
#   regular  0.62  transient cards    notifications
#   thick    0.85  dense small text   tooltip
#   --       0.25  scrims             the dim wash behind a card (never blurred, see hyprland.lua)
#   --       0.65  lock input card    excluded from this tier system -- see [lock] below
#
# Card alpha must stay above hyprland.lua's scrim_card_ignore_alpha (0.33)
# with margin, or blur silently turns off for that card too.

[bar]
# Alpha companions (where present) range from 0 (invisible) to 1 (opaque).
background       = "#1a1b1e"
background-alpha = 0.52
text             = "#eaeaef"
active           = "#ef5d67"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(ffffff66) rgba(ffffff22) 90deg"
active-border-foreground = "rgba(ffffff66) rgba(ffffff22) 90deg"

[controls]
normal-color        = "#eaeaef"
normal-fill-alpha   = 0.04
normal-border       = "#eaeaef"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#eaeaef"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#eaeaef"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#eaeaef"
focus-fill-alpha   = 0.08
focus-border       = "#eaeaef"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#eaeaef"
selected-fill-alpha   = 0.18
selected-border       = "#eaeaef"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
# Bar flyouts, plus the network/bluetooth/keyboard-driven panels (they read
# Color.popups directly). Blurred through omarchy-bar's blur_popups layer
# rule and, for the panels, their own omarchy-keyboard-panel layer rule.
background       = "#1a1b1e"
background-alpha = 0.52
text             = "#eaeaef"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
# Small and text-dense, so it sits at the readable end of the scale.
background       = "#1a1b1e"
background-alpha = 0.85
text             = "#eaeaef"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1a1b1e"
background-alpha = 0.62
text             = "#eaeaef"
border           = "#ffffff"
border-alpha     = 0.33
countdown        = "#ffffff"
# countdown has no countdown-alpha key in the Quattro schema, so the legacy
# progress-color alpha (~0.33) is an unavoidable limitation: the hue is
# preserved exactly, the translucency cannot be.

[launcher]
# scrim/background split explained under [menu] just below -- launcher shares
# the identical Menu.qml scrim+card structure (currently unused by any live
# surface, kept in sync for when it is).
background                = "#1a1b1e"
background-alpha          = 0.43
text                      = "#eaeaef"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1b1e"
scrim-alpha               = 0.25
selected-background       = "#eaeaef"
selected-background-alpha = 0.08
selected-text             = "#7ca5ff"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[menu]
# The menu (and clipboard/emojis, which share these tokens) render as ONE
# layer surface with two regions: a fullscreen `scrim` and a smaller `card`
# on top. hyprland.lua gates blur on this surface with
# scrim_card_ignore_alpha = 0.33, so the scrim (0.25, below the gate) falls
# through unblurred as a light dim wash -- visually distinct, no material --
# while the card (0.43, above the gate) keeps the frosted blur and reads as
# unmistakably separate glass on top of it. Keep background-alpha and
# scrim-alpha on opposite sides of that gate, with margin, if you touch
# either -- see hyprland.lua's comment on why the margin matters.
background                = "#1a1b1e"
background-alpha          = 0.43
text                      = "#eaeaef"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1b1e"
scrim-alpha               = 0.25
selected-background       = "#eaeaef"
selected-background-alpha = 0.08
selected-text             = "#7ca5ff"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[polkit]
# Same scrim+card split as [menu], but the card stays more opaque -- this is
# the password prompt, so it favors readability over frost.
background       = "#1a1b1e"
background-alpha = 0.55
text             = "#eaeaef"
text-error       = "#ef5d67"
border           = "hyprland.active-border"
border-error     = "#ef5d67"
border-alpha     = 1.0
scrim            = "#1a1b1e"
scrim-alpha      = 0.25
accent           = "#7ca5ff"

[lock]
# The lock screen is an ext-session-lock surface, not a layer surface, so no
# Hyprland layer rule reaches it -- Quickshell blurs its own wallpaper via a
# QML MultiEffect with a fixed radius/saturation this repo has no file for
# and can't touch. None of the blur.contrast/brightness/vibrancy retuning
# above reaches this surface at all, so its alpha is deliberately left
# unchanged rather than folded into the tier system -- moving just this one
# number would claim a material consistency the theme structurally can't
# deliver here.
background       = "#1a1b1e"
background-alpha = 0.65
text             = "#eaeaef"
placeholder      = "#a3a4a8"
text-error       = "#ef5d67"
border           = "#3a3a3a"
border-active    = "#3a3a3a"
border-error     = "#3a3a3a"
border-alpha     = 1.0
selection        = "#7ca5ff"
selection-alpha  = 0.45

[image-picker]
# No card of its own (see the template's own comment below) -- just the
# scrim, so the whole surface gets the same light, unblurred dim as the
# other scrims rather than the old heavy 0.5 wash.
scrim                   = "#1a1b1e"
scrim-alpha             = 0.25
text                    = "#eaeaef"
selected-border         = "#7ca5ff"
selected-border-alpha   = 1.0
unselected-border       = "#eaeaef"
unselected-border-alpha = 0.28
