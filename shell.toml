# Omarchy Velora — Quickshell surfaces (Omarchy 4 / Quattro).
#
# A literal rendering of default/themed/shell.toml.tpl against this theme's
# colors.toml, with explicit overrides where Velora differs from the template.
# Sections with no Velora design intent (controls, spacing, font, image-picker)
# are left at the template's own default values.
#
# NOTE: a hand-written shell.toml is copied verbatim by
# omarchy-theme-set-templates (no {{ }} substitution runs on non-.tpl files),
# so every value below is a literal, not a placeholder. This also freezes
# controls/spacing/font/image-picker at today's template defaults -- shipping
# shell.<section>.toml overrides instead would let those sections keep tracking
# future Quattro template updates. Flagging the trade-off; keeping the single
# hand-written file as requested.
#
# ── The alpha scale ───────────────────────────────────────────────────────────
# Every surface below is blurred by Hyprland (see hyprland.lua's layer rules),
# so these alphas are the *tint*, not the transparency budget. An alpha above
# ~0.8 blends in so little of the blurred backdrop that the surface reads as
# flat and opaque rather than glass -- measured live on this system: a card at
# 0.90 barely shifted color against a colorful backdrop, while the same card
# at 0.60 showed an obvious soft gradient through it while staying easily
# readable. These values are picked from that test, not the template's own
# high-opacity defaults.
#
#   0.55  persistent chrome     bar
#   0.55  transient overlays    popups (bar flyouts, network/keyboard panels, OSD)
#   0.60  content cards         menu, launcher
#   0.65  transient cards       notifications, lock input card
#   0.68  must-read surfaces    polkit prompt
#   0.85  dense small text      tooltips
#   0.50  scrims                the dim wash behind a card (blurred, not tinted)

[bar]
# Alpha companions (where present) range from 0 (invisible) to 1 (opaque).
background       = "#1a1b1e"
background-alpha = 0.55
text             = "#eaeaef"
active           = "#ef5d67"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(ffffff66) rgba(ffffff22) 90deg"
active-border-foreground = "rgba(ffffff66) rgba(ffffff22) 90deg"

[controls]
normal-color        = "#eaeaef"
normal-fill-alpha   = 0.04
normal-border       = "#eaeaef"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#eaeaef"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#eaeaef"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color        = "#eaeaef"
focus-fill-alpha   = 0.08
focus-border       = "#eaeaef"
focus-border-width = 1
focus-border-alpha = 0.25

selected-color        = "#eaeaef"
selected-fill-alpha   = 0.18
selected-border       = "#eaeaef"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
# Bar flyouts, plus the network/bluetooth/keyboard-driven panels (they read
# Color.popups directly). Blurred through omarchy-bar's blur_popups layer
# rule and, for the panels, their own omarchy-keyboard-panel layer rule.
background       = "#1a1b1e"
background-alpha = 0.55
text             = "#eaeaef"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
# Small and text-dense, so it sits at the readable end of the scale.
background       = "#1a1b1e"
background-alpha = 0.85
text             = "#eaeaef"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#1a1b1e"
background-alpha = 0.65
text             = "#eaeaef"
border           = "#ffffff"
border-alpha     = 0.33
countdown        = "#ffffff"
# countdown has no countdown-alpha key in the Quattro schema, so the legacy
# progress-color alpha (~0.33) is an unavoidable limitation: the hue is
# preserved exactly, the translucency cannot be.

[launcher]
# scrim/background split explained under [menu] just below -- launcher shares
# the identical Menu.qml scrim+card structure (currently unused by any live
# surface, kept in sync for when it is).
background                = "#1a1b1e"
background-alpha          = 0.45
text                      = "#eaeaef"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1b1e"
scrim-alpha               = 0.25
selected-background       = "#eaeaef"
selected-background-alpha = 0.08
selected-text             = "#7ca5ff"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[menu]
# The menu (and clipboard/emojis, which share these tokens) render as ONE
# layer surface with two regions: a fullscreen `scrim` and a smaller `card`
# on top. hyprland.lua gates blur on this surface with ignore_alpha = 0.35,
# so the scrim (0.25, below the gate) falls through unblurred as a light dim
# wash, while the card (0.45, above the gate) keeps the frosted blur. Both
# numbers were tuned live: 0.60 on the card still read as flat over a
# low-contrast backdrop (a dark editor/dark web page) because so little
# blurred backdrop was blending in; 0.45 makes the frosting visible even
# there. Keep background-alpha and scrim-alpha on opposite sides of
# hyprland.lua's scrim_card_ignore_alpha if you touch either.
background                = "#1a1b1e"
background-alpha          = 0.45
text                      = "#eaeaef"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#1a1b1e"
scrim-alpha               = 0.25
selected-background       = "#eaeaef"
selected-background-alpha = 0.08
selected-text             = "#7ca5ff"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25

[polkit]
# Same scrim+card split as [menu], but the card stays more opaque -- this is
# the password prompt, so it favors readability over frost.
background       = "#1a1b1e"
background-alpha = 0.55
text             = "#eaeaef"
text-error       = "#ef5d67"
border           = "hyprland.active-border"
border-error     = "#ef5d67"
border-alpha     = 1.0
scrim            = "#1a1b1e"
scrim-alpha      = 0.25
accent           = "#7ca5ff"

[lock]
# The lock screen is an ext-session-lock surface, not a layer surface, so no
# Hyprland layer rule reaches it -- but Quickshell already gaussian-blurs the
# wallpaper behind this card in QML, so the same glass reads correctly here.
background       = "#1a1b1e"
background-alpha = 0.65
text             = "#eaeaef"
placeholder      = "#a3a4a8"
text-error       = "#ef5d67"
border           = "#3a3a3a"
border-active    = "#3a3a3a"
border-error     = "#3a3a3a"
border-alpha     = 1.0
selection        = "#7ca5ff"
selection-alpha  = 0.45

[image-picker]
# No card of its own (see the template's own comment below) -- just the
# scrim, so the whole surface gets the same light, unblurred dim as the
# other scrims rather than the old heavy 0.5 wash.
scrim                   = "#1a1b1e"
scrim-alpha             = 0.25
text                    = "#eaeaef"
selected-border         = "#7ca5ff"
selected-border-alpha   = 1.0
unselected-border       = "#eaeaef"
unselected-border-alpha = 0.28
